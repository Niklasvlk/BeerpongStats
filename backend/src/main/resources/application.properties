spring.application.name=BeerpongStats
server.port=${PORT:8080}
server.address=0.0.0.0
# Hinter einem TLS-Proxy (Render) sonst: Cookies ohne Secure-Flag, falsche Schemas in Weiterleitungen
server.forward-headers-strategy=native
server.servlet.session.cookie.same-site=lax

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# Das Schema verwaltet Flyway (db/migration), Hibernate prüft es nur
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Obergrenzen gegen Missbrauch
beerpong.limits.max-groups-per-user=20
beerpong.limits.max-members-per-group=100

# Rate Limiting gegen das Durchprobieren von Passwörtern. Die Grenzen pro Adresse sind großzügig, weil sich auf einer
# Party oder im Mobilfunk viele Leute eine Adresse teilen. Gezählt wird je Client-Adresse (hinter einem Proxy über
# server.forward-headers-strategy), im Speicher: gilt nur für diese Instanz und beginnt nach einem Neustart von vorn.
beerpong.rate-limit.enabled=true
beerpong.rate-limit.login-per-minute=20
beerpong.rate-limit.register-per-hour=40
beerpong.rate-limit.join-per-minute=20
# Falsche Passwörter pro Benutzername innerhalb von 15 Minuten, unabhängig von der Adresse
beerpong.rate-limit.failed-logins-per-username=10
