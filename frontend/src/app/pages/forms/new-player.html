<section>
  <h2>Create a New Player</h2>

  <form class="form-card" [formGroup]="form" (ngSubmit)="submit()">
    <div class="form-row">
      <input type="text" formControlName="name" placeholder="Player Name" />
    </div>
    <div class="form-row">
      <input type="password" formControlName="password" placeholder="Password (min. 4 Zeichen)" />
    </div>
    <div class="form-row">
      <button type="submit" class="btn-primary" [disabled]="form.invalid || submitting()">Add Player</button>
    </div>
    @if (error(); as message) {
      <p class="error-text">{{ message }}</p>
    }
  </form>
</section>
