<section>
  <h2>All Matches</h2>

  <div class="match-list">
    @for (match of matches(); track match.id) {
      <app-match-card [groupId]="group()" [match]="match" />
    }
  </div>
  @if (allMatches.error()) {
    <p class="error-text">Die Matches konnten nicht geladen werden.</p>
  }

  <div style="margin-top: 25px;">
    <a [routerLink]="['/g', group()]" class="btn-primary">Back to Home</a>
  </div>
</section>
