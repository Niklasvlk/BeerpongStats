<section>
  <div class="player-details-card">
    @if (player(); as p) {
      <div class="player-name">{{ p.name }}</div>
      <div class="player-stats">
        <div>Wins: <span>{{ p.wins }}</span></div>
        <div>Losses: <span>{{ p.losses }}</span></div>
        <div>Winrate: <span>{{ p.winRate | percent: '1.2-2' }}</span></div>
        <div>Avg Cups: <span>{{ p.avgCups | number: '1.2-2' }}</span></div>
      </div>
    }

    <div style="margin-top: 20px;">
      <button type="button" class="btn-primary" style="margin-bottom: 10px;" (click)="logout()">Logout</button>
      <button type="button" class="btn-danger" (click)="deleteProfile()">Profil löschen</button>
    </div>
    @if (error(); as message) {
      <p class="error-text">{{ message }}</p>
    }
  </div>
</section>
