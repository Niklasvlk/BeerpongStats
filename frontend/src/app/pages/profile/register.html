<section>
  <h2>Register</h2>

  <form class="form-card" [formGroup]="form" (ngSubmit)="submit()">
    <div class="form-row">
      <input type="text" formControlName="username" placeholder="Benutzername" autocomplete="username" />
    </div>
    <div class="form-row">
      <input
        type="password"
        formControlName="password"
        placeholder="Passwort (min. 4 Zeichen)"
        autocomplete="new-password"
      />
    </div>
    <div class="form-row">
      <button type="submit" class="btn-primary" [disabled]="form.invalid || submitting()">Register</button>
    </div>
    @if (error(); as message) {
      <p class="error-text">{{ message }}</p>
    }
  </form>

  <p class="muted auth-hint">
    Schon einen Account?
    <a routerLink="/login" [queryParams]="{ returnUrl: returnUrl() }">Zum Login</a>
  </p>
</section>
